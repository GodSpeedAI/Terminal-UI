name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node/npx is required by `registry:validate`, which runs the real
      # `shadcn registry validate` CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      # typecheck, lint, the full test suite (unit + interaction + visual
      # goldens), real-CLI registry validation, and a clean-consumer install
      # of every registry item.
      - run: bun run verify
